on:
  release:
    types: [published]
  # Publishes the version in package.json from the chosen branch, e.g. to retry a release whose run failed.
  workflow_dispatch:

permissions:
  # Required for npm trusted publishing (OIDC); no npm token is stored
  id-token: write
  contents: read

name: publish-to-npm
jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test

      - run: npm publish --access=public
        if: ${{ !github.event.release.prerelease }}
      - run: npm publish --tag prerelease --access=public
        if: ${{ github.event.release.prerelease }}
